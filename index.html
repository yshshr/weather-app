<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>天气应用</title><script defer="defer" src="main.js"></script></head><body><div id="container"><div class="heading"><h1>天气查询</h1><p>支持查看15天预报</p></div><form id="weather-form"><div><label for="location">位置</label> <input id="location" name="location" placeholder="经纬度（如 31,3,120.6）" required/></div><div><label for="toggleUnit">切换单位</label> <input type="button" id="toggleUnit" name="toggleUnit" value="摄氏度" data-unit-group="metric"/></div><button>查询天气</button></form><div id="today-conditon"></div><table id="weather-data"><tr><th>&nbsp;</th><th>天气图标</th><th>天气状况</th><th>最低温度</th><th>最高温度</th><th>湿度</th><th>描述</th></tr></table></div></body></html>
